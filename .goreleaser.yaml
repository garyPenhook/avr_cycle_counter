# GoReleaser config — cross-compiles cyclecount and publishes a GitHub release.
# Run locally with `goreleaser release --snapshot --clean` to dry-run.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: cyclecount
    binary: cyclecount
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Stamp main.version with the git tag (matches the -X flag used by hand).
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows ARM64 build — not a realistic target for this tool.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    # tar.gz everywhere except Windows, which gets a .zip.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # e.g. cyclecount-linux-amd64.tar.gz — keeps the names from the v0.1.0 release.
    name_template: "cyclecount-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # Auto-generate notes from commits between tags.
  draft: false
  prerelease: auto

changelog:
  use: github
