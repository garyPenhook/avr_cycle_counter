# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Run bundled JS actions on Node 24 so the Node 20 deprecation notice is gone
# (setup-go still ships Node 20 today). Drop once the actions default to Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Track the version declared in go.mod so CI never drifts from it.
        go-version-file: go.mod
        # No external dependencies / go.sum, so module caching has nothing to do.
        cache: false

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
